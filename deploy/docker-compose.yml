services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vpn
      POSTGRES_PASSWORD: vpn
      POSTGRES_DB: vpn_sub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn -d vpn_sub"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - default

  app:
    image: ${IMAGE:-vpn_subscription_service:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "23452:23452"
    environment:
      PORT: "23452"
      DATABASE_URL: postgres://vpn:vpn@postgres:5432/vpn_sub?sslmode=disable
      GIN_MODE: ${GIN_MODE:-release}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      XUI_BASE_URL: ${XUI_BASE_URL:-https://172.17.0.1:6217/babaduk}
      XUI_API_TOKEN: ${XUI_API_TOKEN:-}
      XUI_INSECURE_SKIP_VERIFY: ${XUI_INSECURE_SKIP_VERIFY:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:23452}
      TZ: ${TZ:-Europe/Saratov}
      INVITE_GATE_UID: ${INVITE_GATE_UID:-}
      INVITE_PAGE_UID: ${INVITE_PAGE_UID:-}
      INVITE_ADMIN_UID: ${INVITE_ADMIN_UID:-}
      INVITE_TZ: ${INVITE_TZ:-Europe/Saratov}
      INVITE_REVEAL_AT: ${INVITE_REVEAL_AT:-2026-09-25T20:00:00}
      INVITE_VIDEO_PATH: ${INVITE_VIDEO_PATH:-/data/invite/card.mp4}
    volumes:
      - ./invite-media:/data/invite:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:23452/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:

networks:
  default:
